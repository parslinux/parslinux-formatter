<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <radialGradient id="particle-glow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="800" height="260" rx="16" fill="url(#banner-bg)"/>
  <rect width="800" height="260" rx="16" fill="url(#particle-glow)"/>
  <rect width="800" height="260" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Decorative Border -->
  <rect x="0" y="0" width="800" height="4" fill="url(#cyan-glow)"/>

  <!-- Left Side: App Icon Group -->
  <g transform="translate(48, 45)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="170" height="170" rx="36" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- USB Plug -->
    <rect x="62" y="22" width="46" height="34" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="70" y="30" width="9" height="12" rx="2" fill="#0f172a"/>
    <rect x="91" y="30" width="9" height="12" rx="2" fill="#0f172a"/>

    <!-- USB Chassis -->
    <rect x="50" y="52" width="70" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="52" y1="64" x2="118" y2="64" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="85" cy="76" r="3.5" fill="#38bdf8"/>

    <!-- Format Ring Badge -->
    <circle cx="120" cy="120" r="32" fill="#0f172a" stroke="url(#cyan-glow)" stroke-width="3"/>
    <path d="M 120 102 A 18 18 0 0 1 138 120 L 133 120 A 13 13 0 0 0 120 107 Z" fill="#38bdf8"/>
    <polygon points="138,114 144,120 133,124" fill="#38bdf8"/>
    <path d="M 120 138 A 18 18 0 0 1 102 120 L 107 120 A 13 13 0 0 0 120 133 Z" fill="#10b981"/>
    <polygon points="102,126 96,120 107,116" fill="#10b981"/>
    <circle cx="120" cy="120" r="4" fill="#f8fafc"/>
  </g>

  <!-- Right Side: Typography & Subtitle -->
  <text x="250" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    ParsLinux Formatter
  </text>
  
  <text x="252" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#38bdf8" letter-spacing="0.5">
    YÜKSEK HIZLI VE GÜVENLİ USB DİSK BİÇİMLENDİRME MOTORU
  </text>

  <!-- Feature Badges -->
  <g transform="translate(252, 172)">
    <!-- Badge 1: FAT32 / NTFS / EXFAT -->
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="19" font-family="monospace" font-size="12" font-weight="600" fill="#94a3b8">FAT32 • NTFS • EXFAT</text>

    <!-- Badge 2: EXT4 / BTRFS / F2FS -->
    <rect x="140" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="152" y="19" font-family="monospace" font-size="12" font-weight="600" fill="#10b981">EXT4 • BTRFS • F2FS</text>

    <!-- Badge 3: 5-Layer Safety -->
    <rect x="280" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="290" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">🛡️ 5-Kat Güvenlik</text>

    <!-- Badge 4: GTK4 & CLI -->
    <rect x="405" y="0" width="85" height="28" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="415" y="19" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc">GTK4 &amp; CLI</text>
  </g>
</svg>
